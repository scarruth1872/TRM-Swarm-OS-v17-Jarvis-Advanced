# mTLS Configuration for Swarm OS v12
# Enforces mutual TLS between all internal services.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mtls-config
  namespace: swarm-os
data:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    MIIDazCCAlMCFAjxR3... (Base64 encoded CA certificate)
    -----END CERTIFICATE-----
  server.crt: |
    -----BEGIN CERTIFICATE-----
    MIIDazCCAlMCFAjxR3... (Base64 encoded server certificate)
    -----END CERTIFICATE-----
  server.key: |
    -----BEGIN RSA PRIVATE KEY-----
    MIIEpAIBAAKCAQEA... (Base64 encoded server key)
    -----END RSA PRIVATE KEY-----
  tls-policy: |
    min-version: "1.3"
    cipher-suites:
      - TLS_AES_256_GCM_SHA384
      - TLS_CHACHA20_POLY1305_SHA256
    client-auth: "RequireAndVerifyClientCert"
