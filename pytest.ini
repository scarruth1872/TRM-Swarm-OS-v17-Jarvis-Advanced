[pytest]
testpaths = tests swarm_v2
python_files = test_*.py
python_functions = test_*
asyncio_mode = auto

# THE SUITE COULD NEVER COMPLETE, AND THIS IS WHY.
# Tests marked `integration` require live services. swarm_v2/core/test_research_api.py
# is already decorated @pytest.mark.integration - the marker was ALWAYS there - but
# nothing deselected it, so `test_start_stop_daemon_endpoints` ran and hung forever:
#     self.client.post("/research/stop")   <- never returns
# pytest-timeout could not recover either: the thread method cannot interrupt the
# blocked call, so it dumped the stack and killed the process (EXIT=1, no summary).
# A suite that cannot finish reports nothing, so a static fixture was written instead
# and served as if it were a result.
#
# Excluded by default so the unit suite RUNS. Integration tests are still available
# explicitly: pytest -m integration
addopts = -m "not integration and not live_service and not asgi and not integration_live"

# Directories holding STANDALONE SCRIPTS, not test modules. Several are named
# test_*.py but execute at import time - one dials 127.0.0.1:8021 (RETIRED) and
# raises ConnectionError during COLLECTION, aborting the entire run with
# "Interrupted: 1 error during collection". Excluded so the suite can run at all.
norecursedirs =
    scratch
    scrape_dumps
    node_modules
    .git
    __pycache__
    train_venv
    backups
    site-packages
    .venv
    venv
    swarm_v2_artifacts/scratch
    swarm_v2_integrated/scratch

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests that require running services
    live_service: requires a service listening on 8022; excluded by default
    asgi: in-process ASGI tests (fastapi TestClient(app)); they exercise handlers
        without touching a socket, so they do NOT prove the running stack works.
        Excluded by default; run with 'pytest -m asgi'
    integration_live: real HTTP tests against the nine live ports
        (8022/8099/3000/3001/3002/5183/8587/8588/8593). No TestClient, no
        in-process app import. Excluded by default; run with
        'pytest -m integration_live'. Override the target with TRM_LIVE_HOST or
        TRM_LIVE_PORT_OVERRIDE (e.g. =9) to prove the tests can fail.

filterwarnings =
    ignore::DeprecationWarning
    ignore::RuntimeWarning

# A collection error must be VISIBLE, not silently swallowed. Kept off so that a
# broken import fails the run rather than quietly shrinking the test count.
