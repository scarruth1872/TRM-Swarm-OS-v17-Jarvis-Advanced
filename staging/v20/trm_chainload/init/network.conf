# TRM SWARM OS -- the address this machine should have on its own network.
#
# PID 1 reads this file off the volume before the machine is handed over, brings the first network
# interface up (or the one named by `iface=`), and applies the address. The NIC drivers are staged
# in the RAM image (e1000, e1000e, r8169, igb), so nothing else is needed.
#
# With no `ip=` line the platform starts anyway, and the machine gives ITSELF a link-local address
# (169.254.x.y, derived from its own MAC and printed in the boot log as `DASHBOARD: ... over the
# network`). That reaches a directly-cabled machine -- whose other end also takes a 169.254 address --
# and nothing on a routed LAN. For the dashboard on your own network, set a real address here:
# the kernel serves it on every interface it has, on port 5183 (`/ui/`) and on 8022 (`/ui/`).
#
# Format -- one per line, `#` at the start of a line is a comment:
#     ip=192.168.1.50/24          the address and the prefix length
#     gw=192.168.1.1              optional: a default route
#     iface=eth0                  optional: which interface (the first one otherwise)
#
# Ask the machine's own boot log for the interface name and MAC if you are not sure -- it prints
# `NET: <name> up (mac ..)` on every boot.
#
# Uncomment and set these for the network this machine is on, then boot:
# ip=192.168.1.50/24
# gw=192.168.1.1
