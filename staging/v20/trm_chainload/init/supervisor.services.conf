# TRM Swarm OS - supervisor service table for the BARE-METAL image.
#
# Same grammar as the host's table, with the paths this image actually has. The kernel is started by
# the supervisor here too, so the health the platform reports is measured by the supervisor running
# on the SAME machine -- not a file carried over from the host.
#
# Grammar: key | name | port | health_url | cwd | argv
# An EMPTY argv means DECLARED, NOT STARTED: reported every pass, never spawned.

rust_kernel | Native Rust Sovereign Kernel | 8022 | http://127.0.0.1:8022/infrastructure/status | /opt/trm | /opt/trm/host_council_server
dashboard | Swarm UI Dashboard (kernel-served at :5183/ui/) | 5183 | http://127.0.0.1:5183/ui/ | /opt/trm/dashboard |
